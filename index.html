<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="A consensual, international WhatsApp contact-sharing community platform. Register voluntarily, manage privacy &amp; consent, download verified contact releases, and grow your global network." />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('contact_gaining_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased transition-colors duration-200 selection:bg-[#C5A15B] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
